services:
  - type: web
    name: deepvision-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GEMINI_API_KEY
        sync: false  # Paste your Google AI Studio API key in the Render Dashboard
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
